[package]
name = "sinter-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "The C interface that Sinter uses to load tree-sitter grammars from WebAssembly"

[lib]
name = "sinter_bridge"
crate-type = ["staticlib"]

[dependencies]
tree-sitter = { version = "0.26", features = ["wasm"] }
# @cites rust-bridge
# tree-sitter re-exports wasmtime. This entry names no second copy of
# wasmtime: it adds the "cache" feature to the copy tree-sitter builds.
wasmtime = { version = "36", default-features = false, features = ["cache", "cranelift", "runtime", "std"] }
# @cites sha256
sha2 = "=0.10.9"
# @cites toml-reader
toml_edit = "=0.22.27"

[profile.release]
opt-level = 2
