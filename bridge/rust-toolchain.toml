# The bridge builds with one pinned Rust toolchain, in CI and on every
# contributor's machine, so that a new lint in a newer stable release
# cannot break the build. Bump the version here on purpose.
[toolchain]
channel = "1.94.1"
components = ["rustfmt", "clippy"]
