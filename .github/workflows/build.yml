name: build

on:
  pull_request:
  push:
    branches: [main]

env:
  OCAML_VERSION: "5.5.0"

jobs:
  build:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The opam switch, with the project's dependencies installed, is
      # cached under a key that names the platform, the compiler, and
      # the lock file. A lock change falls back to the previous switch
      # and installs only the difference. setup-ocaml's own cache is
      # off, because it would restore a switch without dependencies.
      - name: Restore the opam switch
        uses: actions/cache@v4
        with:
          path: |
            _opam
            ~/.opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ hashFiles('sinter.opam.locked') }}
          restore-keys: |
            opam-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-
      # Installs the toolchain that bridge/rust-toolchain.toml pins.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache: false
          override: true
          toolchain: 1.94.1
          components: rustfmt, clippy
      # A dune rule runs cargo. lib/bridge/build.sh puts cargo's build
      # output in ~/.cache/sinter-bridge-build. The key holds the lock
      # file, so a change of a Rust dependency starts from an empty
      # cache.
      - name: Cache the cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/sinter-bridge-build
          key: cargo-build-${{ matrix.os }}-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-build-${{ matrix.os }}-
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          cache: false
      - name: Install dependencies
        run: opam install . --deps-only --with-test --with-dev-setup --locked
      - name: Build
        run: opam exec -- dune build
      - name: Test
        run: opam exec -- dune test

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore the opam switch
        uses: actions/cache@v4
        with:
          path: |
            _opam
            ~/.opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ hashFiles('sinter.opam.locked') }}
          restore-keys: |
            opam-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-
      # Installs the toolchain that bridge/rust-toolchain.toml pins.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache: false
          override: true
          toolchain: 1.94.1
          components: rustfmt, clippy
      - name: Cache the cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/sinter-bridge-build
          key: cargo-format-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-format-
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          cache: false
      - name: Install dependencies
        run: opam install . --deps-only --with-test --with-dev-setup --locked
      - name: Check that the code is formatted
        run: opam exec -- dune build @fmt

  rust:
    name: Check the bridge crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain that bridge/rust-toolchain.toml pins.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache: false
          override: true
          toolchain: 1.94.1
          components: rustfmt, clippy
      - name: Cache the cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target
          key: cargo-rust-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-rust-
      - name: Check that the crate is formatted
        run: cargo fmt --check --manifest-path bridge/Cargo.toml
      - name: Check the crate with clippy
        run: >
          cargo clippy --manifest-path bridge/Cargo.toml --all-targets
          -- -D warnings
