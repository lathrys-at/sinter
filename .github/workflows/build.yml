name: build

on:
  pull_request:
  push:
    branches: [main]

env:
  OCAML_VERSION: "5.5.0"

jobs:
  build:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # The opam switch, with the project's dependencies installed, is
      # cached under a key that names the platform, the compiler, and
      # the lock file. A lock change falls back to the previous switch
      # and installs only the difference. setup-ocaml's own cache is
      # off, because it would restore a switch without dependencies.
      # Only the switch is cached, not the opam root: a restored root
      # holds a git clone of opam-repository that opam init cannot
      # always update.
      - name: Restore the opam switch
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ hashFiles('sinter.opam.locked') }}
          restore-keys: |
            opam-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          cache: false
      - name: Install dependencies
        run: opam install . --deps-only --with-test --with-dev-setup --locked
      - name: Build
        run: opam exec -- dune build
      - name: Test
        run: opam exec -- dune test

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore the opam switch
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ hashFiles('sinter.opam.locked') }}
          restore-keys: |
            opam-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          cache: false
      - name: Install dependencies
        run: opam install . --deps-only --with-test --with-dev-setup --locked
      - name: Check that the code is formatted
        run: opam exec -- dune build @fmt
