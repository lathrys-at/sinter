name: build

on:
  pull_request:
  push:
    branches: [main]

env:
  OCAML_VERSION: "5.5.0"

jobs:
  build:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # The opam switch, with the project's dependencies installed, is
      # cached under a key that names the platform, the compiler, and
      # the lock file. A lock change falls back to the previous switch
      # and installs only the difference. setup-ocaml's own cache is
      # off, because it would restore a switch without dependencies.
      # Only the switch is cached, not the opam root: a restored root
      # holds a git clone of opam-repository that opam init cannot
      # always update.
      - name: Restore the opam switch
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ hashFiles('sinter.opam.locked') }}
          restore-keys: |
            opam-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache: false
          override: true
          toolchain: 1.94.1
          components: rustfmt, clippy
      # The dune rule that runs cargo writes its build output under
      # ~/.cache/sinter-bridge-build.
      - name: Cache the cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/sinter-bridge-build
          key: cargo-build-${{ matrix.os }}-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-build-${{ matrix.os }}-
      # opam clones opam-repository and walks the clone at once. Git's
      # background maintenance can remove its lock file in that window,
      # and opam then fails on the vanished file. Turn it off.
      - name: Turn off git background maintenance
        run: git config --global maintenance.auto false
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          cache: false
      - name: Install dependencies
        run: opam install . --deps-only --with-test --with-dev-setup --locked
      # Two checkouts that share one cargo build directory can link
      # each other's library. Each checkout must get its own.
      - name: Check that two checkouts do not share a build directory
        run: |
          set -eu
          first=$(mktemp -d)/bridge
          second=$(mktemp -d)/bridge
          mkdir -p "$first" "$second"
          one=$(sh lib/bridge/build.sh --target-dir "$first")
          two=$(sh lib/bridge/build.sh --target-dir "$second")
          echo "one: $one"
          echo "two: $two"
          test "$one" != "$two"
      - name: Build
        run: opam exec -- dune build
      - name: Test
        run: opam exec -- dune test

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore the opam switch
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ hashFiles('sinter.opam.locked') }}
          restore-keys: |
            opam-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-
      # opam clones opam-repository and walks the clone at once. Git's
      # background maintenance can remove its lock file in that window,
      # and opam then fails on the vanished file. Turn it off.
      - name: Turn off git background maintenance
        run: git config --global maintenance.auto false
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          cache: false
      - name: Install dependencies
        run: opam install . --deps-only --with-test --with-dev-setup --locked
      - name: Check that the code is formatted
        run: opam exec -- dune build @fmt

  rust:
    name: Check the bridge crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache: false
          override: true
          toolchain: 1.94.1
          components: rustfmt, clippy
      - name: Cache the cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target
          key: cargo-rust-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-rust-
      - name: Check that the crate is formatted
        run: cargo fmt --check --manifest-path bridge/Cargo.toml
      - name: Check the crate with clippy
        run: >
          cargo clippy --release --manifest-path bridge/Cargo.toml
          --all-targets -- -D warnings
      - name: Run the crate's tests
        run: cargo test --release --manifest-path bridge/Cargo.toml
      # The list of libraries that a static link of the crate needs
      # differs between macOS and Linux. This step reports the Linux
      # list in the log of the job.
      - name: Report the libraries that a static link needs
        run: >
          cargo rustc --release --manifest-path bridge/Cargo.toml
          -- --print native-static-libs

  coverage:
    name: Measure coverage
    runs-on: ubuntu-latest
    # This job builds what the build job builds: the same compiler,
    # and the dependencies from the lock file. It adds one tool,
    # bisect_ppx, which rewrites the modules of the library and the
    # tool to count the points the tests run.
    #
    # bisect_ppx is pinned to a commit, and the pin lives here and in
    # CONTRIBUTING.md, not in dune-project or in the lock file. The
    # reason is that no release of bisect_ppx installs beside the
    # locked dependencies: the last release, 2.8.3 of 2023, asks for
    # ppxlib below 0.36 and cmdliner below 2, and the lock file holds
    # cmdliner 2.1.1 and a compiler that no ppxlib below 0.36
    # supports. The commit below is the head of the open upstream pull
    # request 448, which builds against the newer ppxlib and the newer
    # cmdliner and still calls itself version 2.8.3. Remove the pin,
    # and install the release instead, when upstream publishes a
    # version that installs beside the lock file.
    env:
      # The head of upstream pull request 448, "Support ppxlib.0.36.0".
      # A commit, never a branch, so that every run builds the same
      # source.
      BISECT_PPX_COMMIT: "7061d643ff492b0045796357ee6917ded21fb1f0"
      # The job fails when the total is below this number. Raise it
      # when the number grows. Do not lower it.
      COVERAGE_MINIMUM: "92"
    steps:
      - uses: actions/checkout@v6
      # This switch holds the pinned tool as well as the project's
      # dependencies, so it has a cache key of its own, and the key
      # names the pinned commit. A new commit builds a new switch.
      - name: Restore the opam switch
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-coverage-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ env.BISECT_PPX_COMMIT }}-${{ hashFiles('sinter.opam.locked') }}
          restore-keys: |
            opam-coverage-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ env.BISECT_PPX_COMMIT }}-
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache: false
          override: true
          toolchain: 1.94.1
      # The dune rule that runs cargo writes its build output under
      # ~/.cache/sinter-bridge-build. This job keeps a key of its own,
      # so that it does not race the build job over one cache entry.
      - name: Cache the cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/sinter-bridge-build
          key: cargo-coverage-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-coverage-
      # opam clones opam-repository and walks the clone at once. Git's
      # background maintenance can remove its lock file in that window,
      # and opam then fails on the vanished file. Turn it off.
      - name: Turn off git background maintenance
        run: git config --global maintenance.auto false
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          cache: false
      - name: Install the dependencies
        run: opam install . --deps-only --with-test --locked
      # The pin goes in after the dependencies, and bisect_ppx is
      # installed on a line of its own. --with-test on the line above
      # reaches every package named on that line, and bisect_ppx asks
      # for ocamlformat 0.16.0 to run its own tests, which no compiler
      # this new can build.
      - name: Install the pinned bisect_ppx
        run: |
          set -eu
          opam pin add -y -n bisect_ppx \
            "git+https://github.com/aantron/bisect_ppx.git#$BISECT_PPX_COMMIT"
          opam install -y bisect_ppx
      - name: Run the tests with the code instrumented
        run: >
          opam exec -- dune build @runtest --force
          --instrument-with bisect_ppx
      # bisect-ppx-report reads the counts under _build, so it needs
      # no path.
      - name: Report the coverage
        run: |
          set -eu
          per_file=$(opam exec -- bisect-ppx-report summary --per-file)
          printf '%s\n' "$per_file"
          printf '## Coverage\n\n```\n%s\n```\n' "$per_file" \
            >> "$GITHUB_STEP_SUMMARY"
          total=$(opam exec -- bisect-ppx-report summary |
            sed -n 's/^Coverage: .*(\([0-9.]*\)%)$/\1/p')
          if [ -z "$total" ]; then
            echo "The report gave no total. The line it prints changed."
            exit 1
          fi
          echo "Coverage is $total%. The minimum is $COVERAGE_MINIMUM%."
          below=$(awk "BEGIN { print ($total < $COVERAGE_MINIMUM) ? 1 : 0 }")
          test "$below" = 0

  mutation:
    name: Measure the mutation score
    runs-on: ubuntu-latest
    # A mutation tester makes one small change to the source, called a
    # mutant, and runs the test suite with that change switched on. A
    # mutant that no test fails on has survived, and it names a
    # behaviour that no test checks. The share of the mutants that the
    # suite caught is the score.
    #
    # This job builds what the build job builds: the same compiler,
    # and the dependencies from the lock file. It adds one tool,
    # mutaml, which rewrites the modules of the library and the tool
    # so that one mutant at a time can be switched on.
    #
    # mutaml is pinned to a commit of the project's fork, and the pin
    # lives here and in CONTRIBUTING.md, not in dune-project or in the
    # lock file. The reason is that the released mutaml does not build
    # on this compiler, loses its working files under current dune,
    # and makes no mutant of a comparison operator. The fork carries
    # the fixes. Remove the pin, and install a release instead, when
    # upstream publishes a version that does all three.
    env:
      # The head of the fork's main branch, after its pull request 6.
      # A commit, never a branch, so that every run builds the same
      # source.
      MUTAML_COMMIT: "552416cb1e9444a1ce0d3fbeba6f8efb7732e9a4"
      # The job fails when the score is below this number. Raise it
      # when the number grows. Do not lower it. 91 is the measured
      # score, 91.1 per cent, rounded down to a whole number, as the
      # decision record mutation-testing rules. The measurement
      # covers bin/main.ml, which holds eight of the thirty-five
      # survivors and which no earlier measurement reached.
      MUTATION_MINIMUM: "91"
    steps:
      - uses: actions/checkout@v6
      # This switch holds the pinned tool as well as the project's
      # dependencies, so it has a cache key of its own, and the key
      # names the pinned commit. A new commit builds a new switch.
      - name: Restore the opam switch
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-mutation-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ env.MUTAML_COMMIT }}-${{ hashFiles('sinter.opam.locked') }}
          restore-keys: |
            opam-mutation-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ env.MUTAML_COMMIT }}-
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache: false
          override: true
          toolchain: 1.94.1
      # The dune rule that runs cargo writes its build output under
      # ~/.cache/sinter-bridge-build. This job keeps a key of its own,
      # so that it does not race the other jobs over one cache entry.
      - name: Cache the cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/sinter-bridge-build
          key: cargo-mutation-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-mutation-
      # opam clones opam-repository and walks the clone at once. Git's
      # background maintenance can remove its lock file in that window,
      # and opam then fails on the vanished file. Turn it off.
      - name: Turn off git background maintenance
        run: git config --global maintenance.auto false
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          cache: false
      - name: Install the dependencies
        run: opam install . --deps-only --with-test --locked
      # mutaml is not a dependency of the package, so the line above
      # does not install it. It is pinned here, by commit, and
      # installed on a line of its own, which carries no --with-test,
      # so that opam builds the tool and not the tool's own test
      # suite. The coverage job installs bisect_ppx the same way.
      - name: Install the pinned mutaml
        run: |
          set -eu
          opam pin add -y -n mutaml \
            "git+https://github.com/lathrys-at/mutaml.git#$MUTAML_COMMIT"
          opam install -y mutaml
      # This build writes one side file for each instrumented source
      # file, beside the build context in _build/.mutaml/default, and
      # it runs the suite once with no mutant switched on, which also
      # puts the suite's fixtures under _build/default/test.
      - name: Build the tests with the code instrumented
        env:
          # The preprocessor reads these two, and nothing else does.
          # A rate of 100 puts a mutant at every place that can hold
          # one, so that a pass covers the whole set, and the seed
          # then decides nothing; it is fixed so that a rate below
          # 100 would still give the same set twice running.
          MUTAML_MUT_RATE: "100"
          MUTAML_SEED: "42"
        run: >
          opam exec -- dune build @runtest --force
          --instrument-with mutaml
      # The runner starts at the repository root, so that it finds the
      # side files and resolves the source paths that they name. The
      # suite reads its fixtures relative to the build copy of test/,
      # so the test command is a script that changes into that copy
      # first. A run started in the wrong place finds no side file and
      # tests no mutant; mutaml-report then says that it found no test
      # results and exits with 1, and the step after this one fails on
      # that and calls it a fault of the run. The total row of the
      # Markdown summary names the number of mutants, so a person
      # reads the count on the page of the job.
      #
      # The seeds fix what the property tests draw. The runner
      # replaces the two characters {} in the value of --test-env by
      # the number of the run, so --repeat 3 --test-env
      # QCHECK_SEED={} gives one mutant the seeds 1, 2, and 3. A
      # mutant runs again only while the run before it passed; a
      # mutant that any seed kills is killed, and only a mutant that
      # all three seeds passed is a survivor. A seed that misses a
      # mutant therefore no longer makes that mutant a survivor, and
      # a killed mutant usually still costs one run.
      #
      # The runner also runs the suite with no mutant twice and stops
      # when the two runs disagree, because a suite whose answer
      # depends on the seed gives the score no meaning. Both of those
      # runs are run number 1, so {} would give them the same seed
      # and they would be one run done twice. --baseline-env
      # therefore carries a number of its own, and the two runs with
      # no mutant are seeds 1 and 2, as they were before.
      #
      # The runner derives the time that one run may take from the
      # run with no mutant: five times that run, and never less than
      # ten seconds. It starts each run itself and stops one that
      # reaches the limit, so this job needs no timeout command and
      # carries no number of seconds of its own. The "timed out"
      # column of the summary stays the check: a mutant that hangs
      # the suite reads there, and a count that grows on a run which
      # changed no source says the machine was slower than the
      # baseline it was measured against.
      #
      # -j tests several mutants at one time. Each worker runs a test
      # process of its own and has a TMPDIR of its own, and the
      # results keep the order of the mutants, so the report does not
      # depend on which run ends first. The number is the core count
      # of the machine the job runs on, read at run time, so the job
      # carries no number that fits one machine. The fork's README
      # advises the core count less one, because the suite already
      # uses the machine; a job runner runs nothing else, so this
      # takes the whole count. The runner refuses -j above 1 for a
      # test command that starts with dune, which locks the build
      # directory; the command here is a script.
      #
      # The runner prints one line, "Skipping ...", for each mutant
      # file whose source file it cannot find, and goes on. A pass
      # that skipped a file measured part of the tree, and its score
      # says nothing about the rest, so the job keeps the runner's
      # output and fails on that line.
      - name: Run the tests for each mutant under three seeds
        run: |
          set -euo pipefail
          mkdir -p _mutations
          opam exec -- mutaml-runner \
            --build-context _build/default \
            -j "$(nproc)" \
            --repeat 3 \
            --test-env 'QCHECK_SEED={}' \
            --baseline-env QCHECK_SEED=2 \
            test/run-mutants.sh 2>&1 | tee _mutations/runner.log
          if grep -q '^Skipping ' _mutations/runner.log; then
            echo "The runner skipped a mutant file, so the pass measured" \
              "part of the tree. The lines above that start with" \
              "Skipping name the files. Run dune clean and build again."
            exit 1
          fi
      # mutaml-report reads mutaml-report.json, which the runner wrote
      # in this directory, so it needs no path. It exits with 0 when
      # the score is at or above --fail-under, with 2 when the score
      # is below it, and with another status when the tool itself
      # failed. The job fails on both, and says which happened.
      - name: Report the mutation score
        run: |
          set -eu
          mkdir -p _mutations
          status=0
          opam exec -- mutaml-report \
            --fail-under "$MUTATION_MINIMUM" \
            --markdown "$GITHUB_STEP_SUMMARY" \
            --json-report _mutations/report.json || status=$?
          if [ "$status" = 2 ]; then
            echo "The mutation score is below the minimum of" \
              "$MUTATION_MINIMUM per cent. The summary of this job" \
              "names every mutant that survived. Write a test that" \
              "kills each one."
            exit "$status"
          fi
          if [ "$status" != 0 ]; then
            echo "mutaml-report failed with status $status. It is" \
              "the run that failed, not the score: the report is" \
              "missing, or it holds no mutant because the runner" \
              "started in the wrong directory, or one of the two" \
              "report files could not be written."
            exit "$status"
          fi
          echo "The mutation score is at or above the minimum of" \
            "$MUTATION_MINIMUM per cent."
      # The JSON report is in the format that Stryker, Infection, and
      # Mull share, so a person can open it in a viewer of that
      # format. Upload it whether the gate passed or failed: it is
      # most wanted when it failed.
      - name: Upload the JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: _mutations/report.json
          if-no-files-found: warn
