name: build

on:
  pull_request:
  push:
    branches: [main]

env:
  OCAML_VERSION: "5.5.0"

jobs:
  build:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # The opam switch, with the project's dependencies installed, is
      # cached under a key that names the platform, the compiler, and
      # the lock file. A lock change falls back to the previous switch
      # and installs only the difference. setup-ocaml's own cache is
      # off, because it would restore a switch without dependencies.
      # Only the switch is cached, not the opam root: a restored root
      # holds a git clone of opam-repository that opam init cannot
      # always update.
      - name: Restore the opam switch
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ hashFiles('sinter.opam.locked') }}
          restore-keys: |
            opam-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache: false
          override: true
          toolchain: 1.94.1
          components: rustfmt, clippy
      # The dune rule that runs cargo writes its build output under
      # ~/.cache/sinter-bridge-build.
      - name: Cache the cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/sinter-bridge-build
          key: cargo-build-${{ matrix.os }}-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-build-${{ matrix.os }}-
      # opam clones opam-repository and walks the clone at once. Git's
      # background maintenance can remove its lock file in that window,
      # and opam then fails on the vanished file. Turn it off.
      - name: Turn off git background maintenance
        run: git config --global maintenance.auto false
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          cache: false
      - name: Install dependencies
        run: opam install . --deps-only --with-test --with-dev-setup --locked
      # Two checkouts that share one cargo build directory can link
      # each other's library. Each checkout must get its own.
      - name: Check that two checkouts do not share a build directory
        run: |
          set -eu
          first=$(mktemp -d)/bridge
          second=$(mktemp -d)/bridge
          mkdir -p "$first" "$second"
          one=$(sh lib/bridge/build.sh --target-dir "$first")
          two=$(sh lib/bridge/build.sh --target-dir "$second")
          echo "one: $one"
          echo "two: $two"
          test "$one" != "$two"
      - name: Build
        run: opam exec -- dune build
      - name: Test
        run: opam exec -- dune test

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore the opam switch
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ hashFiles('sinter.opam.locked') }}
          restore-keys: |
            opam-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-
      # opam clones opam-repository and walks the clone at once. Git's
      # background maintenance can remove its lock file in that window,
      # and opam then fails on the vanished file. Turn it off.
      - name: Turn off git background maintenance
        run: git config --global maintenance.auto false
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          cache: false
      - name: Install dependencies
        run: opam install . --deps-only --with-test --with-dev-setup --locked
      - name: Check that the code is formatted
        run: opam exec -- dune build @fmt

  rust:
    name: Check the bridge crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache: false
          override: true
          toolchain: 1.94.1
          components: rustfmt, clippy
      - name: Cache the cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target
          key: cargo-rust-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-rust-
      - name: Check that the crate is formatted
        run: cargo fmt --check --manifest-path bridge/Cargo.toml
      - name: Check the crate with clippy
        run: >
          cargo clippy --release --manifest-path bridge/Cargo.toml
          --all-targets -- -D warnings
      - name: Run the crate's tests
        run: cargo test --release --manifest-path bridge/Cargo.toml
      # The list of libraries that a static link of the crate needs
      # differs between macOS and Linux. This step reports the Linux
      # list in the log of the job.
      - name: Report the libraries that a static link needs
        run: >
          cargo rustc --release --manifest-path bridge/Cargo.toml
          -- --print native-static-libs

  coverage:
    name: Measure coverage
    runs-on: ubuntu-latest
    # bisect_ppx 2.8.3 needs ppxlib below 0.36, which needs a compiler
    # below 5.4, and it needs cmdliner below 2. sinter.opam.locked
    # pins cmdliner 2.1.1, so this job builds a switch of its own, on
    # a compiler of its own, and does not use the lock file. The
    # number it reports therefore comes from a build that is not the
    # build the other jobs make.
    env:
      COVERAGE_OCAML_VERSION: "5.3.0"
      # The job fails when the total is below this number. Raise it
      # when the number grows. Do not lower it.
      COVERAGE_MINIMUM: "90"
    steps:
      - uses: actions/checkout@v6
      - name: Restore the opam switch
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.COVERAGE_OCAML_VERSION }}-${{ hashFiles('sinter.opam') }}
          restore-keys: |
            opam-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.COVERAGE_OCAML_VERSION }}-
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache: false
          override: true
          toolchain: 1.94.1
      # The dune rule that runs cargo writes its build output under
      # ~/.cache/sinter-bridge-build. This job keeps a key of its own,
      # so that it does not race the build job over one cache entry.
      - name: Cache the cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/sinter-bridge-build
          key: cargo-coverage-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-coverage-
      # opam clones opam-repository and walks the clone at once. Git's
      # background maintenance can remove its lock file in that window,
      # and opam then fails on the vanished file. Turn it off.
      - name: Turn off git background maintenance
        run: git config --global maintenance.auto false
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.COVERAGE_OCAML_VERSION }}
          cache: false
      # bisect_ppx goes in first, because it holds cmdliner below 2 and
      # the project then takes the cmdliner that is already there. The
      # other order installs cmdliner 2 and leaves no room for
      # bisect_ppx. Do not name bisect_ppx on the line that carries
      # --with-test: the flag reaches every package on the line, and
      # the test dependencies of bisect_ppx need a compiler below 4.13.
      - name: Install bisect_ppx and the dependencies
        run: |
          opam install bisect_ppx.2.8.3
          opam install . --deps-only --with-test
      - name: Run the tests with the code instrumented
        run: >
          opam exec -- dune build @runtest --force
          --instrument-with bisect_ppx
      # bisect-ppx-report reads the counts under _build, so it needs
      # no path.
      - name: Report the coverage
        run: |
          set -eu
          per_file=$(opam exec -- bisect-ppx-report summary --per-file)
          printf '%s\n' "$per_file"
          printf '## Coverage\n\n```\n%s\n```\n' "$per_file" \
            >> "$GITHUB_STEP_SUMMARY"
          total=$(opam exec -- bisect-ppx-report summary |
            sed -n 's/^Coverage: .*(\([0-9.]*\)%)$/\1/p')
          if [ -z "$total" ]; then
            echo "The report gave no total. The line it prints changed."
            exit 1
          fi
          echo "Coverage is $total%. The minimum is $COVERAGE_MINIMUM%."
          below=$(awk "BEGIN { print ($total < $COVERAGE_MINIMUM) ? 1 : 0 }")
          test "$below" = 0
