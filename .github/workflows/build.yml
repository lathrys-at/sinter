name: build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"

env:
  OCAML_VERSION: "5.5.2"

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            image: ubuntu-26.04
          - os: macos-latest
            image: macos-26
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Name the runner image
        id: image
        run: |
          test -n "$ImageOS"
          echo "os=$ImageOS" >>"$GITHUB_OUTPUT"
      - name: Restore the opam switch
        id: opam
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-v3-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ hashFiles('sinter.opam.locked') }}
          restore-keys: |
            opam-v3-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Cache the cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/sinter-bridge-build
          key: cargo-build-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-build-${{ steps.image.outputs.os }}-${{ runner.arch }}-
      - name: Turn off git background maintenance
        if: steps.opam.outputs.cache-hit != 'true'
        run: git config --global maintenance.auto false
      - uses: ocaml/setup-ocaml@v3
        if: steps.opam.outputs.cache-hit != 'true'
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          cache: false
      - name: Install dependencies
        if: steps.opam.outputs.cache-hit != 'true'
        run: opam install . --deps-only --with-test --with-dev-setup --locked
      - name: Put the switch on the path
        run: |
          prefix="$GITHUB_WORKSPACE/_opam"
          echo "$prefix/bin" >>"$GITHUB_PATH"
          echo "OPAM_SWITCH_PREFIX=$prefix" >>"$GITHUB_ENV"
          echo "CAML_LD_LIBRARY_PATH=$prefix/lib/stublibs:$prefix/lib/ocaml/stublibs" >>"$GITHUB_ENV"
      - name: Check that two checkouts do not share a build directory
        run: |
          set -eu
          first=$(mktemp -d)/bridge
          second=$(mktemp -d)/bridge
          mkdir -p "$first" "$second"
          one=$(sh lib/bridge/build.sh --target-dir "$first")
          two=$(sh lib/bridge/build.sh --target-dir "$second")
          echo "one: $one"
          echo "two: $two"
          test "$one" != "$two"
      - name: Build
        id: build
        run: dune build
      - name: Check that sinter.opam matches dune-project
        run: git diff --exit-code -- sinter.opam
      - name: Test
        run: dune test
      - name: Check Sinter with Sinter
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.os == 'ubuntu-latest' }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            gate=review
          else
            gate=merged
          fi
          echo "The gate is $gate."
          dune exec -- sinter check --gate "$gate"

  format:
    name: Check formatting
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Name the runner image
        id: image
        run: |
          test -n "$ImageOS"
          echo "os=$ImageOS" >>"$GITHUB_OUTPUT"
      - name: Restore the opam switch
        id: opam
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-v3-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ hashFiles('sinter.opam.locked') }}
          restore-keys: |
            opam-v3-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-
      - name: Turn off git background maintenance
        if: steps.opam.outputs.cache-hit != 'true'
        run: git config --global maintenance.auto false
      - uses: ocaml/setup-ocaml@v3
        if: steps.opam.outputs.cache-hit != 'true'
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          cache: false
      - name: Install dependencies
        if: steps.opam.outputs.cache-hit != 'true'
        run: opam install . --deps-only --with-test --with-dev-setup --locked
      - name: Put the switch on the path
        run: |
          prefix="$GITHUB_WORKSPACE/_opam"
          echo "$prefix/bin" >>"$GITHUB_PATH"
          echo "OPAM_SWITCH_PREFIX=$prefix" >>"$GITHUB_ENV"
          echo "CAML_LD_LIBRARY_PATH=$prefix/lib/stublibs:$prefix/lib/ocaml/stublibs" >>"$GITHUB_ENV"
      - name: Check that the code is formatted
        run: dune build @fmt

  plugin:
    name: Check the plugin manifests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Check that the two manifests carry one version
        run: |
          set -eu
          plugin=$(jq -r .version plugins/sinter/.claude-plugin/plugin.json)
          market=$(jq -r '.plugins[] | select(.name == "sinter") | .version' .claude-plugin/marketplace.json)
          echo "plugin.json: $plugin"
          echo "marketplace.json: $market"
          test -n "$plugin"
          test "$plugin" = "$market"

  rust:
    name: Check the bridge crate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Name the runner image
        id: image
        run: |
          test -n "$ImageOS"
          echo "os=$ImageOS" >>"$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Cache the cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target
          key: cargo-rust-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-rust-${{ steps.image.outputs.os }}-${{ runner.arch }}-
      - name: Check that the crate is formatted
        run: cargo fmt --check --manifest-path bridge/Cargo.toml
      - name: Check the crate with clippy
        run: >
          cargo clippy --release --manifest-path bridge/Cargo.toml
          --all-targets -- -D warnings
      - name: Run the crate's tests
        run: cargo test --release --manifest-path bridge/Cargo.toml
      - name: Check that the crate refuses panic = "abort"
        run: |
          set -u
          if RUSTFLAGS="-C panic=abort" cargo check --release --manifest-path bridge/Cargo.toml --target-dir bridge/target/abort-check 2>bridge/target/abort.log; then
            echo "the crate built with panic = \"abort\", and it must not"
            exit 1
          fi
          grep -q 'the bridge needs unwinding panics' bridge/target/abort.log || { cat bridge/target/abort.log; exit 1; }
      - name: Report the libraries that a static link needs
        run: >
          cargo rustc --release --manifest-path bridge/Cargo.toml
          -- --print native-static-libs

  coverage:
    name: Measure coverage
    runs-on: ubuntu-26.04
    env:
      # @cites instrumented-tooling
      BISECT_PPX_COMMIT: "7061d643ff492b0045796357ee6917ded21fb1f0"
      COVERAGE_MINIMUM: "94"
    steps:
      - uses: actions/checkout@v7
      - name: Name the runner image
        id: image
        run: |
          test -n "$ImageOS"
          echo "os=$ImageOS" >>"$GITHUB_OUTPUT"
      - name: Restore the opam switch
        id: opam
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-coverage-v3-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ env.BISECT_PPX_COMMIT }}-${{ hashFiles('sinter.opam.locked') }}
          restore-keys: |
            opam-coverage-v3-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ env.BISECT_PPX_COMMIT }}-
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          toolchain: 1.99.1
      - name: Cache the cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/sinter-bridge-build
          key: cargo-coverage-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-coverage-${{ steps.image.outputs.os }}-${{ runner.arch }}-
      - name: Turn off git background maintenance
        if: steps.opam.outputs.cache-hit != 'true'
        run: git config --global maintenance.auto false
      - uses: ocaml/setup-ocaml@v3
        if: steps.opam.outputs.cache-hit != 'true'
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          cache: false
      - name: Install the dependencies
        if: steps.opam.outputs.cache-hit != 'true'
        run: opam install . --deps-only --with-test --locked
      - name: Install the pinned bisect_ppx
        if: steps.opam.outputs.cache-hit != 'true'
        run: |
          set -eu
          opam pin add -y -n bisect_ppx \
            "git+https://github.com/aantron/bisect_ppx.git#$BISECT_PPX_COMMIT"
          opam install -y bisect_ppx
      - name: Put the switch on the path
        run: |
          prefix="$GITHUB_WORKSPACE/_opam"
          echo "$prefix/bin" >>"$GITHUB_PATH"
          echo "OPAM_SWITCH_PREFIX=$prefix" >>"$GITHUB_ENV"
          echo "CAML_LD_LIBRARY_PATH=$prefix/lib/stublibs:$prefix/lib/ocaml/stublibs" >>"$GITHUB_ENV"
      - name: Run the tests with the code instrumented
        env:
          QCHECK_SEED: "1"
        run: >
          dune build @runtest --force
          --instrument-with bisect_ppx
      - name: Report the coverage
        run: |
          set -eu
          per_file=$(bisect-ppx-report summary --per-file)
          printf '%s\n' "$per_file"
          printf '## Coverage\n\n```\n%s\n```\n' "$per_file" \
            >> "$GITHUB_STEP_SUMMARY"
          total=$(bisect-ppx-report summary |
            sed -n 's/^Coverage: .*(\([0-9.]*\)%)$/\1/p')
          if [ -z "$total" ]; then
            echo "The report gave no total. The line it prints changed."
            exit 1
          fi
          echo "Coverage is $total%. The minimum is $COVERAGE_MINIMUM%."
          below=$(awk "BEGIN { print ($total < $COVERAGE_MINIMUM) ? 1 : 0 }")
          test "$below" = 0

  mutation:
    name: Measure the mutation score
    runs-on: ubuntu-26.04
    # @cites mutation-job-scope
    env:
      # @cites mutation-testing
      MUTAML_COMMIT: "b41eaafd112350ec4d0e2ee9f2336eb37e7b8fd7"
      # @cites mutation-gate
      MUTATION_MINIMUM: "95"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # @cites mutation-job-scope
      - name: Decide what this run measures
        id: scope
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "mode=full" >>"$GITHUB_OUTPUT"
            echo "Every mutant: this is a run on main."
            exit 0
          fi
          base=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)
          echo "base=$base" >>"$GITHUB_OUTPUT"
          dependencies=$(git diff --name-only "$base" -- \
            sinter.opam.locked sinter.opam dune-project \
            .github/workflows/build.yml \
            bridge/Cargo.lock bridge/Cargo.toml bridge/rust-toolchain.toml \
            lib/markdown/tree-sitter-markdown.wasm \
            test/run-mutants.sh | wc -l)
          if [ "$dependencies" -ne 0 ]; then
            echo "mode=full" >>"$GITHUB_OUTPUT"
            echo "Every mutant: the pull request changed $dependencies files of the dependencies."
            exit 0
          fi
          changed=$(git diff --name-only "$base" -- lib bin | wc -l)
          if [ "$changed" -eq 0 ]; then
            echo "mode=none" >>"$GITHUB_OUTPUT"
            echo "No mutant: the pull request changed no file under lib/ or bin/."
          else
            echo "mode=changed" >>"$GITHUB_OUTPUT"
            echo "The mutants on the lines changed since $base, in $changed files under lib/ and bin/."
          fi
      - name: Name the runner image
        if: steps.scope.outputs.mode != 'none'
        id: image
        run: |
          test -n "$ImageOS"
          echo "os=$ImageOS" >>"$GITHUB_OUTPUT"
      - name: Restore the opam switch
        if: steps.scope.outputs.mode != 'none'
        id: opam
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-mutation-v2-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ env.MUTAML_COMMIT }}-${{ hashFiles('sinter.opam.locked') }}
          restore-keys: |
            opam-mutation-v2-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ env.MUTAML_COMMIT }}-
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        if: steps.scope.outputs.mode != 'none'
        with:
          cache: false
          toolchain: 1.99.1
      - name: Cache the cargo state
        if: steps.scope.outputs.mode != 'none'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/sinter-bridge-build
          key: cargo-mutation-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-mutation-${{ steps.image.outputs.os }}-${{ runner.arch }}-
      - name: Turn off git background maintenance
        if: steps.scope.outputs.mode != 'none' && steps.opam.outputs.cache-hit != 'true'
        run: git config --global maintenance.auto false
      - uses: ocaml/setup-ocaml@v3
        if: steps.scope.outputs.mode != 'none' && steps.opam.outputs.cache-hit != 'true'
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          cache: false
      - name: Install the dependencies
        if: steps.scope.outputs.mode != 'none' && steps.opam.outputs.cache-hit != 'true'
        run: opam install . --deps-only --with-test --locked
      - name: Install the pinned mutaml
        if: steps.scope.outputs.mode != 'none' && steps.opam.outputs.cache-hit != 'true'
        run: |
          set -eu
          opam pin add -y -n mutaml \
            "git+https://github.com/lathrys-at/mutaml.git#$MUTAML_COMMIT"
          opam install -y mutaml
      - name: Put the switch on the path
        if: steps.scope.outputs.mode != 'none'
        run: |
          prefix="$GITHUB_WORKSPACE/_opam"
          echo "$prefix/bin" >>"$GITHUB_PATH"
          echo "OPAM_SWITCH_PREFIX=$prefix" >>"$GITHUB_ENV"
          echo "CAML_LD_LIBRARY_PATH=$prefix/lib/stublibs:$prefix/lib/ocaml/stublibs" >>"$GITHUB_ENV"
      - name: Build the tests with the code instrumented
        if: steps.scope.outputs.mode != 'none'
        env:
          MUTAML_MUT_RATE: "100"
          MUTAML_SEED: "42"
        run: >
          dune build @runtest --force
          --instrument-with mutaml
      - name: Run the tests for each mutant under three seeds
        if: steps.scope.outputs.mode != 'none'
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          BASE: ${{ steps.scope.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p _mutations
          cores=$(nproc)
          workers=$cores
          if [ "$workers" -gt 1 ]; then
            workers=$((workers - 1))
          fi
          echo "Cores: $cores. Workers: $workers."
          set -- test/run-mutants.sh
          if [ "$MODE" = changed ]; then
            set -- --changed-since "$BASE" "$@"
          fi
          mutaml-runner \
            --build-context _build/default \
            -j "$workers" \
            --repeat 3 \
            --test-env 'QCHECK_SEED={}' \
            --baseline-env QCHECK_SEED=2 \
            "$@" 2>&1 | tee _mutations/runner.log
          if grep -q '^Skipping ' _mutations/runner.log; then
            echo "The runner skipped a mutant file, so the pass measured" \
              "part of the tree. The lines above that start with" \
              "Skipping name the files. Run dune clean and build again."
            exit 1
          fi
      - name: Report the mutation score
        if: steps.scope.outputs.mode != 'none'
        run: |
          set -eu
          mkdir -p _mutations
          status=0
          mutaml-report \
            --fail-under "$MUTATION_MINIMUM" \
            --markdown "$GITHUB_STEP_SUMMARY" \
            --json-report _mutations/report.json || status=$?
          if [ "$status" = 2 ]; then
            echo "The mutation score is below the minimum of" \
              "$MUTATION_MINIMUM per cent. The summary of this job" \
              "names every mutant that survived. Each one is a" \
              "behaviour that no test checks. Write the test that" \
              "kills it, or, when no input can tell the change from" \
              "the original, mark the place in the source with a" \
              "reason; CONTRIBUTING.md says how to write each."
            exit "$status"
          fi
          if [ "$status" != 0 ]; then
            echo "mutaml-report failed with status $status. It is" \
              "the run that failed, not the score: the report is" \
              "missing, or it holds no mutant because the runner" \
              "started in the wrong directory, or one of the two" \
              "report files could not be written."
            exit "$status"
          fi
          echo "The mutation score is at or above the minimum of" \
            "$MUTATION_MINIMUM per cent."
      - name: Upload the JSON report
        if: always() && steps.scope.outputs.mode != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: _mutations/report.json
          if-no-files-found: warn

  performance:
    name: Measure performance
    runs-on: ubuntu-26.04
    # @cites performance-budgets
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether this run measures
        id: scope
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "measure=true" >>"$GITHUB_OUTPUT"
            echo "A run on main measures."
            exit 0
          fi
          base=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)
          changed=$(git diff --name-only "$base" -- \
            lib bin bridge bench \
            sinter.opam.locked sinter.opam dune-project \
            .github/workflows/build.yml \
            bridge/Cargo.lock bridge/Cargo.toml bridge/rust-toolchain.toml \
            lib/markdown/tree-sitter-markdown.wasm \
            test/run-mutants.sh | wc -l)
          if [ "$changed" -eq 0 ]; then
            echo "measure=false" >>"$GITHUB_OUTPUT"
            echo "No measure: the pull request changed no file of the code, the benchmark, or the dependencies."
          else
            echo "measure=true" >>"$GITHUB_OUTPUT"
            echo "The pull request changed $changed files of the code, the benchmark, or the dependencies."
          fi
      - name: Name the runner image
        if: steps.scope.outputs.measure == 'true'
        id: image
        run: |
          test -n "$ImageOS"
          echo "os=$ImageOS" >>"$GITHUB_OUTPUT"
      - name: Restore the opam switch
        if: steps.scope.outputs.measure == 'true'
        id: opam
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-v3-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-${{ hashFiles('sinter.opam.locked') }}
          restore-keys: |
            opam-v3-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ env.OCAML_VERSION }}-
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        if: steps.scope.outputs.measure == 'true'
        with:
          cache: false
          toolchain: 1.99.1
      - name: Cache the cargo state
        if: steps.scope.outputs.measure == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/sinter-bridge-build
          key: cargo-performance-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-performance-${{ steps.image.outputs.os }}-${{ runner.arch }}-
      - name: Turn off git background maintenance
        if: steps.scope.outputs.measure == 'true' && steps.opam.outputs.cache-hit != 'true'
        run: git config --global maintenance.auto false
      - uses: ocaml/setup-ocaml@v3
        if: steps.scope.outputs.measure == 'true' && steps.opam.outputs.cache-hit != 'true'
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          cache: false
      - name: Install dependencies
        if: steps.scope.outputs.measure == 'true' && steps.opam.outputs.cache-hit != 'true'
        run: opam install . --deps-only --with-test --with-dev-setup --locked
      - name: Put the switch on the path
        if: steps.scope.outputs.measure == 'true'
        run: |
          prefix="$GITHUB_WORKSPACE/_opam"
          echo "$prefix/bin" >>"$GITHUB_PATH"
          echo "OPAM_SWITCH_PREFIX=$prefix" >>"$GITHUB_ENV"
          echo "CAML_LD_LIBRARY_PATH=$prefix/lib/stublibs:$prefix/lib/ocaml/stublibs" >>"$GITHUB_ENV"
      - name: Install perf
        if: steps.scope.outputs.measure == 'true'
        run: |
          set -u
          if sudo apt-get update -q >/dev/null &&
            sudo apt-get install -y -q --no-install-recommends \
              "linux-tools-$(uname -r)" linux-tools-common >/dev/null; then
            echo "perf is installed for the kernel $(uname -r)."
          else
            echo "perf did not install for the kernel $(uname -r)."
            echo "The run measures the peak memory only."
          fi
          paranoid=$(cat /proc/sys/kernel/perf_event_paranoid)
          echo "kernel.perf_event_paranoid is $paranoid."
          if [ "$paranoid" -gt 2 ]; then
            sudo sysctl -w kernel.perf_event_paranoid=2
          fi
      - name: Build
        if: steps.scope.outputs.measure == 'true'
        run: dune build bin/main.exe bench/run.exe bench/generate.exe
      - name: Measure and check the budgets
        if: steps.scope.outputs.measure == 'true'
        run: |
          set -eu
          mkdir -p _performance
          _build/default/bench/run.exe \
            --sinter _build/default/bin/main.exe \
            --generator _build/default/bench/generate.exe \
            --self . \
            --self-manifest bench/sinter-self.toml \
            --budgets bench/budgets.toml \
            --json _performance/results.json \
            --markdown "$GITHUB_STEP_SUMMARY"
      - name: Upload the measures
        if: always() && steps.scope.outputs.measure == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: performance
          path: _performance/results.json
          if-no-files-found: warn
