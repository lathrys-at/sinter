version = 1
SPDX-PackageName = "sinter"
SPDX-PackageSupplier = "The Sinter Authors"

[[annotations]]
path = ["spec/**", "docs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Sinter Authors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "The Sinter Authors"
SPDX-License-Identifier = "Apache-2.0"

# The prebuilt grammar of tree-sitter-json and its license text. The
# file NOTICE beside them names the repository and the release tag.
[[annotations]]
path = ["test/fixtures/tree-sitter-json/**"]
precedence = "override"
SPDX-FileCopyrightText = "2014 Max Brunsfeld"
SPDX-License-Identifier = "MIT"

# The prebuilt block grammar of tree-sitter-markdown, which the binary
# embeds, and its license text. The file NOTICE beside them names the
# repository and the release tag.
[[annotations]]
path = ["lib/markdown/tree-sitter-markdown.wasm", "lib/markdown/LICENSE", "lib/markdown/NOTICE"]
precedence = "override"
SPDX-FileCopyrightText = "2021 Matthias Deiml"
SPDX-License-Identifier = "MIT"

# The cases of the TOML test suite, toml-test, and its license text.
# The file NOTICE beside them names the repository and the release tag.
[[annotations]]
path = ["test/fixtures/toml-test/**"]
precedence = "override"
SPDX-FileCopyrightText = "2018 TOML authors"
SPDX-License-Identifier = "MIT"
