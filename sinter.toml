sinter-spec = "1.0"

[scan]
packs.markdown.files = ["**/*.md", "!test/**"]
namespaces.gh = "[1-9][0-9]*"

[paths]
exempt = [
  ".gitignore",
  ".ocamlformat",
  "DCO",
  "LICENSE",
  "LICENSE-SPEC",
  "LICENSES/",
  "NOTICE",
  "REUSE.toml",
  "THIRD_PARTY.md",
  "bridge/Cargo.lock",
  "bridge/Cargo.toml",
  "dune-project",
  "sinter.opam",
  "sinter.opam.locked",
]
decision = ["docs/decisions/"]

[check]
warn-only = false
